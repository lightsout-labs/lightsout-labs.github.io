name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make check

  e2e:
    runs-on: ubuntu-latest
    # Chromium for Playwright and Lighthouse; the tag matches @playwright/test.
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: make e2e
        env:
          HOME: /root
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          if-no-files-found: ignore
